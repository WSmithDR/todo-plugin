name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22.18+ ejecuta .ts borrando los tipos, sin flag y sin build.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      # Los .ts corren bajo los DOS runtimes en producción y no siempre los
      # parsean igual: un `const declare = …` que node y tsc aceptan sin chistar
      # rompe el parser de bun. La suite corre en ambos por eso.
      - uses: oven-sh/setup-bun@v2

      - name: Core tests (node)
        run: node --test 'src/**/*.test.ts'
      - name: Core tests (bun)
        run: bun test src/

      # Sin build, este es el ÚNICO typecheck del proyecto. No es opcional.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run hook tests
        run: bash bin/dev/test-hooks.sh

      # Un --check que nadie corre es documentación: ankify tiene el suyo escrito
      # y ningún workflow, y acumuló 1/8 manifiestos desincronizados.
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check manifest drift
        run: python3 bin/dev/generate-cli-configs.py --check

      # Declarar no es verificar: que todo lo que los manifiestos y hooks
      # declaran exista en disco y arranque de verdad.
      - name: Conformance
        run: bash bin/todo-health.sh --strict
