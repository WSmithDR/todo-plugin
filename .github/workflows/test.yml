name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        run: bash bin/dev/test-hooks.sh

      # Un --check que nadie corre es documentación: ankify tiene el suyo escrito
      # y ningún workflow, y acumuló 1/8 manifiestos desincronizados.
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check manifest drift
        run: python3 bin/dev/generate-cli-configs.py --check
